# nginx สำหรับ wallet.yoalink.com — wallet-watch (พอร์ต 3960)
# รับทาง :80 เหมือน keydee เพราะโซน yoalink.com บน Cloudflare เป็นโหมด Flexible และ *.yoalink.com ชี้มาเครื่องนี้อยู่แล้ว
# /hook/<token> เปิดให้มือถือยิงเข้ามาโดยไม่ต้องล็อกอิน (token ต่อเครื่องเป็นตัวกัน) · ที่เหลือทั้งหมดต้องผ่าน basic auth
# ติดตั้ง: cp deploy/nginx-wallet.conf /etc/nginx/sites-available/wallet && ln -s ../sites-available/wallet /etc/nginx/sites-enabled/wallet
#         สร้าง /etc/nginx/wallet.htpasswd แล้ว nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name wallet.yoalink.com;

    access_log /var/log/nginx/wallet.access.log;
    error_log  /var/log/nginx/wallet.error.log;

    client_max_body_size 512k;

    location ~ ^/(hook|tm)/ {
        proxy_pass http://127.0.0.1:3960;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        auth_basic "wallet-watch";
        auth_basic_user_file /etc/nginx/wallet.htpasswd;
        proxy_pass http://127.0.0.1:3960;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
